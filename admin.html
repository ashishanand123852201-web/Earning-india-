<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>QuantumEarn Pro — Admin Panel</title>
<link rel="stylesheet" href="css/style.css"/>
<style>
  .app{max-width:980px}
  .topbar{max-width:980px;margin:0 auto}
  .tabbar{display:none}
  .admin-page{padding:20px}
  @media(max-width:680px){table.adm{font-size:11px}table.adm th,table.adm td{padding:7px 5px}}
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <div class="left">
      <div class="brand-logo" style="background:linear-gradient(135deg,#ef4444,#7c2d12)">A</div>
      <div>
        <div class="title">Admin Console</div>
        <div style="font-size:11px;color:var(--muted)" id="adminWho">Sign-in required</div>
      </div>
    </div>
    <button class="icon-btn" id="adminLogout" title="Logout">⏻</button>
  </div>

  <!-- LOGIN -->
  <div class="admin-page" id="adminLoginPage">
    <div class="auth-card" style="margin:40px auto 0">
      <div class="brand">
        <div class="brand-logo" style="background:linear-gradient(135deg,#ef4444,#7c2d12)">A</div>
        <div class="brand-name">ADMIN CONSOLE</div>
      </div>
      <div class="brand-tag">Restricted area — Authorized personnel only</div>
      <form id="adminLoginForm">
        <div class="field">
          <label>Admin Username</label>
          <span class="ico">👤</span>
          <input type="text" name="user" placeholder="admin" required/>
        </div>
        <div class="field">
          <label>Password</label>
          <span class="ico">🔒</span>
          <input type="password" name="pass" placeholder="••••••••" required/>
        </div>
        <button class="btn-primary" type="submit">SIGN IN AS ADMIN</button>
        <p style="font-size:11.5px;color:var(--muted);text-align:center;margin-top:14px">Default credentials: <b style="color:var(--gold)">admin / admin123</b></p>
      </form>
    </div>
  </div>

  <!-- DASHBOARD -->
  <div class="admin-page" id="adminPanel" style="display:none">
    <h2 style="font-size:20px;font-weight:700;margin-bottom:14px">📊 Overview</h2>
    <div class="admin-grid" id="overviewGrid"></div>

    <div class="admin-actions" id="adminTabs">
      <button class="active" data-atab="users">👥 Users</button>
      <button data-atab="recharge">⬆ Recharges</button>
      <button data-atab="withdraw">⬇ Withdrawals</button>
      <button data-atab="invest">📈 Investments</button>
      <button data-atab="config">⚙️ Settings</button>
      <button data-atab="adjust">💰 Adjust Balance</button>
      <button data-atab="data">🗄 Data</button>
    </div>

    <div id="adminContent"></div>
  </div>
</div>

<script src="js/common.js"></script>
<script src="js/admin.js"></script>
<script defer src="https://static.cloudflareinsights.com/beacon.min.js/v833ccba57c9e4d2798f2e76cebdd09a11778172276447" integrity="sha512-57MDmcccJXYtNnH+ZiBwzC4jb2rvgVCEokYN+L/nLlmO8rfYT/gIpW2A569iJ/3b+0UEasghjuZH/ma3wIs/EQ==" data-cf-beacon='{"version":"2024.11.0","token":"75124c326cb447fe934cde04713ae013","r":1,"server_timing":{"name":{"cfCacheStatus":true,"cfEdge":true,"cfExtPri":true,"cfL4":true,"cfOrigin":true,"cfSpeedBrain":true},"location_startswith":null}}' crossorigin="anonymous"></script>
</body>
</html>
